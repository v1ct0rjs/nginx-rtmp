version: 2
updates:
  # Opens a pull request when a new Alpine release is out (FROM alpine:3.xx).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the GitHub Actions used by the workflow up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
